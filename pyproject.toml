[project]
name = "codeagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "textual>=2.1.0",
]

[project.scripts]
codeagent = "codeagent.app.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
