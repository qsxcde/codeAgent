name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-fast:
    name: Fast quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # git diff --check HEAD^ 需要当前提交的父提交。
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Run correctness lint
        run: uv run ruff check src tests scripts

      - name: Create quality artifact directory
        run: uv run python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"

      - name: Run fast tests with coverage report
        run: >-
          uv run pytest -m "unit or contract" -q -ra --strict-markers
          --cov=codeagent
          --cov-fail-under=77.9
          --cov-report=term-missing
          --cov-report=xml:artifacts/coverage.xml
          --cov-report=json:artifacts/coverage.json
          --junitxml=artifacts/quality-junit.xml

      - name: Check package version consistency
        run: |
          uv run python -c "
          import codeagent, tomllib
          from pathlib import Path
          project_version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert project_version == codeagent.__version__, (
              f'{project_version=} != {codeagent.__version__=}'
          )
          print(f'version={project_version}')
          "

      - name: Check patch formatting
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^
          else
            # 初始提交没有父提交时,检查工作树本身即可。
            git diff --check HEAD
          fi

      - name: Set up Node.js for OpenSpec
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.8.0

      - name: Validate OpenSpec specifications
        run: openspec validate --specs

      - name: Upload fast quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-fast-artifacts
          path: artifacts/
          if-no-files-found: ignore

  test-matrix:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Create test artifact directory
        run: uv run python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"

      - name: Run cross-platform offline tests
        env:
          LLM_PROVIDER: fake
        run: >-
          uv run pytest -m "integration or e2e or platform or compatibility" -q -ra --strict-markers
          --junitxml=artifacts/test-matrix-${{ matrix.os }}.xml

      - name: Upload matrix test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-matrix-${{ matrix.os }}-artifacts
          path: artifacts/
          if-no-files-found: ignore

  package-smoke:
    name: Build and install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install build dependencies
        run: uv sync --locked --group dev

      - name: Create release artifact directory
        run: mkdir -p artifacts

      - name: Run reproducible release check
        env:
          LLM_PROVIDER: fake
        run: >-
          uv run python scripts/release_check.py
          --dist-dir artifacts/dist
          --output artifacts/release-check.json

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-artifacts
          path: artifacts/
          if-no-files-found: ignore

  performance:
    name: TUI performance report (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install benchmark dependencies
        run: uv sync --locked --group dev

      - name: Create benchmark artifact directory
        run: mkdir -p artifacts

      - name: Run deterministic TUI benchmarks
        run: |
          for scenario in history stream tool-output restore; do
            uv run python scripts/benchmark_tui.py \
              --scenario "$scenario" \
              --blocks 100 \
              --stream-chars 10000 \
              --iterations 3 \
              --output "artifacts/tui-${scenario}.json"
          done

      - name: Compare with baseline when available
        run: |
          for scenario in history stream tool-output restore; do
            if [ -f docs/benchmarks/tui-baseline.json ]; then
              uv run python scripts/compare_benchmark.py \
                "artifacts/tui-${scenario}.json" \
                docs/benchmarks/tui-baseline.json \
                > "artifacts/tui-${scenario}-comparison.json"
            else
              uv run python scripts/compare_benchmark.py \
                "artifacts/tui-${scenario}.json" \
                > "artifacts/tui-${scenario}-comparison.json"
            fi
          done

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-performance-artifacts
          path: artifacts/
          if-no-files-found: ignore
